name: TradeIQ Telegram Commands

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Keep command-state updates serialized with the crypto scanner because both
# workflows write to the same repository state.
concurrency:
  group: lbank-crypto-scanner
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crypto.txt

      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python telegram_commands.py

      - name: Save Telegram command state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add telegram_command_state.json

          if git diff --cached --quiet; then
            echo "No command state changes to commit."
            exit 0
          fi

          git commit -m "Update Telegram command state"
          git pull --rebase origin main
          git push origin main
